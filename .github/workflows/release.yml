name: release

on:
  workflow_dispatch:
    inputs:
      api_version:
        description: "API version (empty = latest from dev portal)"
        required: false
        default: ""
      force:
        description: "Re-publish release even if tag exists"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Detect API version
        id: version
        run: |
          if [ -n "${{ inputs.api_version }}" ]; then
            VERSION="${{ inputs.api_version }}"
          else
            VERSION=$(python3 -c "import core; print(core.get_latest_api_version())")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VK API version: $VERSION"

      - name: Skip if release exists
        id: existing
        if: ${{ !inputs.force }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/releases/tags/v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${{ steps.version.outputs.version }} already exists, skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Week bucket
        id: bucket
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache RU descriptions
        uses: actions/cache@v6
        with:
          path: data/parameter_descriptions.json
          key: parameter-descriptions-${{ steps.version.outputs.version }}-${{ steps.bucket.outputs.week }}

      - name: Fetch RU descriptions
        if: ${{ steps.existing.outputs.exists != 'true' }}
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/VKCOM/vk-api-schema /tmp/vk-api-schema
          python3 fetch_parameter_descriptions.py --schema-dir /tmp/vk-api-schema --rps 6

      - name: Generate bundled collection
        if: ${{ steps.existing.outputs.exists != 'true' }}
        run: |
          python3 generate_collection.py \
            --schema-dir /tmp/vk-api-schema \
            --api-version "${{ steps.version.outputs.version }}" \
            --format bundled \
            --out "vk-api-${{ steps.version.outputs.version }}.opencollection.yaml"

      - name: Generate tree collection
        if: ${{ steps.existing.outputs.exists != 'true' }}
        run: |
          python3 generate_collection.py \
            --schema-dir /tmp/vk-api-schema \
            --api-version "${{ steps.version.outputs.version }}" \
            --format tree \
            --out vk-api

      - name: Generate Postman collection
        if: ${{ steps.existing.outputs.exists != 'true' }}
        run: |
          python3 generate_collection.py \
            --schema-dir /tmp/vk-api-schema \
            --api-version "${{ steps.version.outputs.version }}" \
            --format postman \
            --out "vk-api-${{ steps.version.outputs.version }}.postman_collection.json"

      - name: Generate Postman v3 local tree
        if: ${{ steps.existing.outputs.exists != 'true' }}
        run: |
          python3 generate_collection.py \
            --schema-dir /tmp/vk-api-schema \
            --api-version "${{ steps.version.outputs.version }}" \
            --format postman-v3 \
            --out vk-api-local

      - name: Generate OpenAPI spec
        if: ${{ steps.existing.outputs.exists != 'true' }}
        run: |
          python3 generate_collection.py \
            --schema-dir /tmp/vk-api-schema \
            --api-version "${{ steps.version.outputs.version }}" \
            --format openapi \
            --out "vk-api-${{ steps.version.outputs.version }}.openapi.yaml"

      - name: Generate client collections
        if: ${{ steps.existing.outputs.exists != 'true' }}
        run: |
          python3 generate_collection.py \
            --schema-dir /tmp/vk-api-schema \
            --api-version "${{ steps.version.outputs.version }}" \
            --format yaak \
            --out vk-api-yaak
          python3 generate_collection.py \
            --schema-dir /tmp/vk-api-schema \
            --api-version "${{ steps.version.outputs.version }}" \
            --format insomnia \
            --out "vk-api-${{ steps.version.outputs.version }}.insomnia.json"
          python3 generate_collection.py \
            --schema-dir /tmp/vk-api-schema \
            --api-version "${{ steps.version.outputs.version }}" \
            --format insomnia-v5 \
            --out vk-api-insomnia-local
          python3 generate_collection.py \
            --schema-dir /tmp/vk-api-schema \
            --api-version "${{ steps.version.outputs.version }}" \
            --format hoppscotch \
            --out vk-api-hoppscotch

      - name: Validate
        if: ${{ steps.existing.outputs.exists != 'true' }}
        run: |
          pip install --quiet pyyaml jsonschema
          python3 validate_collection.py "vk-api-${{ steps.version.outputs.version }}.opencollection.yaml"
          python3 validate_collection.py vk-api
          python3 validate_collection.py "vk-api-${{ steps.version.outputs.version }}.postman_collection.json"
          python3 validate_collection.py "vk-api-${{ steps.version.outputs.version }}.postman_environment.json"
          python3 validate_collection.py "vk-api-${{ steps.version.outputs.version }}.openapi.yaml"
          python3 validate_collection.py vk-api-local
          python3 validate_collection.py vk-api-yaak
          python3 validate_collection.py "vk-api-${{ steps.version.outputs.version }}.insomnia.json"
          python3 validate_collection.py vk-api-insomnia-local
          python3 validate_collection.py vk-api-hoppscotch/vk-api.hoppscotch.json
          python3 validate_collection.py vk-api-hoppscotch/api.vk.ru.hoppscotch.env.json

      - name: Package artifacts
        if: ${{ steps.existing.outputs.exists != 'true' }}
        run: |
          V="${{ steps.version.outputs.version }}"
          (cd vk-api && zip -qr "../vk-api-${V}.opencollection.zip" .)
          zip -q "vk-api-${V}.opencollection.zip" "vk-api-${V}.opencollection.yaml"
          zip -q "vk-api-${V}.postman.zip" "vk-api-${V}.postman_collection.json" "vk-api-${V}.postman_environment.json"
          zip -qr "vk-api-${V}.postman.zip" vk-api-local
          zip -q "vk-api-${V}.openapi.zip" "vk-api-${V}.openapi.yaml"
          zip -qr "vk-api-${V}.clients.zip" vk-api-yaak
          zip -q "vk-api-${V}.clients.zip" "vk-api-${V}.insomnia.json"
          zip -qr "vk-api-${V}.clients.zip" vk-api-insomnia-local
          zip -qr "vk-api-${V}.clients.zip" vk-api-hoppscotch
          unzip -l "vk-api-${V}.opencollection.zip" | head -5

      - name: Create release
        if: ${{ steps.existing.outputs.exists != 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "VK API ${{ steps.version.outputs.version }}"
          body: |
            API collections for VK API, generated from [VKCOM/vk-api-schema](https://github.com/VKCOM/vk-api-schema) for API version **${{ steps.version.outputs.version }}**.

            - `vk-api-${{ steps.version.outputs.version }}.opencollection.zip` — OpenCollection: tree (Bruno: *File → Open Collection*) + bundled YAML
            - `vk-api-${{ steps.version.outputs.version }}.postman.zip` — Postman: коллекция v2.1 + окружение `api.vk.ru` + `vk-api-local/` (Native Git дерево V3: Files → Open folder)
            - `vk-api-${{ steps.version.outputs.version }}.openapi.zip` — OpenAPI 3.1 (Swagger UI / codegen / Postman import)
            - `vk-api-${{ steps.version.outputs.version }}.clients.zip` — клиентские коллекции: Yaak (`vk-api-yaak/`, sync-папка), Insomnia v4 (`.insomnia.json`, GUI-импорт) + v5 (`vk-api-insomnia-local/`, git-sync папка), Hoppscotch (`vk-api-hoppscotch/`, коллекция + окружение)

            Auth: collection-level Bearer `{{accessToken}}`; `baseUrl`/`apiVersion` are collection variables.
          files: |
            vk-api-${{ steps.version.outputs.version }}.opencollection.zip
            vk-api-${{ steps.version.outputs.version }}.postman.zip
            vk-api-${{ steps.version.outputs.version }}.openapi.zip
            vk-api-${{ steps.version.outputs.version }}.clients.zip
